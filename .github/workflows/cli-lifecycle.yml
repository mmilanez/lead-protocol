name: CLI lifecycle

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-lifecycle.yml'

permissions:
  contents: read

jobs:
  test:
    name: Node 18 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package-smoke:
    name: Package install smoke / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run test:pack
